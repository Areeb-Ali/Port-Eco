<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beera Lia | Market History</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="market-history-page">
    <nav id="mainNav">
        <div class="logo">
            <h1>Beera<span>Lia</span></h1>
            <p>Trader & Macro Analyst</p>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#running-trades">Running Trades</a></li>
            <li><a href="index.html#trades">Trade Setups</a></li>
            <li><a href="index.html#economics">Economics</a></li>
            <li><a href="index.html#services">Services</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <div class="nav-right">
            <div class="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
        <div class="theme-toggle">
            <i class="fas fa-moon"></i>
        </div>
        <div class="social">
            <a href="https://x.com/areebithink" target="_blank" rel="noopener">
                <i class="fab fa-twitter"></i>
            </a>
        </div>
    </nav>

    <div id="tickerWrap">
        <div id="ticker-tape" class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget" id="ticker-widget"></div>
        </div>
    </div>

    <main>
        <section id="full-market-history" class="section">
            <h2>Full Market Analysis History</h2>
            <div class="filters">
                <div class="search-bar-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by title..." aria-label="Search market analysis" />
                </div>
                <div class="filter-controls">
                    <label for="sortSelect">Sort By:</label>
                    <select id="sortSelect">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                </div>
            </div>
            
            <div class="blog-grid" id="fullBlogLogs">
                </div>

            <div id="noResults" class="hidden">
                <p>No analysis found matching your search.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Beera Lia. All rights reserved.</p>
        <div class="footer-links">
            <a href="/disclaimer.html">Disclaimer</a>
            <a href="#">Partnership</a>
            <a href="https://x.com/areebithink" target="_blank" rel="noopener">Twitter</a>
        </div>
    </footer>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="script.js"></script>
</body>
</html>

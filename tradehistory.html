<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade History | Beera Lia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav id="mainNav">
    <div class="logo">
      <h1>Beera<span>Lia</span></h1>
      <p>Trader & Macro Analyst</p>
    </div>
    <ul class="nav-links">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#running-trades">Running Trades</a></li>
      <li><a href="index.html#trades">Recent Trades</a></li>
      <li><a href="index.html#economics">Economics</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-right">
      <div class="mobile-menu-toggle">
        <i class="fas fa-bars"></i>
      </div>
    </div>
    <div class="theme-toggle">
      <i class="fas fa-moon"></i>
    </div>
    <div class="social">
      <a href="https://x.com/areebithink" target="_blank" rel="noopener">
        <i class="fab fa-twitter"></i>
      </a>
    </div>
  </nav>

  <div id="tickerWrap">
    <div id="ticker-tape" class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <!-- ticker script injected by script.js -->
    </div>
  </div>

  <section class="section">
    <h2>Full Trade History</h2>

    <div class="filters" style="display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem;">
      <button class="btn" id="btn7">Last 7 Days</button>
      <button class="btn" id="btn40">Last 40 Days</button>

      <div style="display:flex;align-items:center;gap:.4rem;">
        <label style="font-weight:700;">From:</label>
        <input type="date" id="fromDate">
        <label style="font-weight:700;">To:</label>
        <input type="date" id="toDate">
        <button class="btn" id="applyRange">Apply</button>
        <button class="btn btn-outline" id="showAll">Show All</button>
      </div>
    </div>

    <div id="historyTable" class="trade-grid"></div>
  </section>

  <footer style="margin-top:2rem;">
    <p style="text-align:center;">Back to <a href="index.html">Home</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="script.js"></script>

  <script>
    // Wait a brief moment to ensure script.js has attached window.__trading_portfolio
    function readyRender() {
      const containerId = 'historyTable';
      const render = window.renderHistoryToContainer;
      const filterFn = window.filterTradesForHistory;

      // default: show all
      const all = filterFn();
      render(containerId, all);

      document.getElementById('btn7').addEventListener('click', function() {
        const data = filterFn(7);
        render(containerId, data);
      });

      document.getElementById('btn40').addEventListener('click', function() {
        const data = filterFn(40);
        render(containerId, data);
      });

      document.getElementById('applyRange').addEventListener('click', function() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        if (!from && !to) {
          alert('Please select From and/or To dates.');
          return;
        }
        const data = filterFn(null, from, to);
        render(containerId, data);
      });

      document.getElementById('showAll').addEventListener('click', function() {
        const data = filterFn();
        render(containerId, data);
      });
    }

    // wait until trading portfolio data available
    const waitForData = setInterval(() => {
      if (window.__trading_portfolio && window.renderHistoryToContainer) {
        clearInterval(waitForData);
        readyRender();
      }
    }, 150);
  </script>
</body>
</html>

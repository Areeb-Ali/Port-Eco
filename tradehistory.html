<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade History | Beera Lia</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <nav id="mainNav">
    <div class="logo"><h1>Beera<span>Lia</span></h1><p>Trader & Macro Analyst</p></div>
    <ul class="nav-links">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#running-trades">Running Trades</a></li>
      <li><a href="index.html#trades">Recent Trades</a></li>
      <li><a href="index.html#economics">Economics</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-right"><div class="mobile-menu-toggle"><i class="fas fa-bars"></i></div></div>
    <div class="theme-toggle"><i class="fas fa-moon"></i></div>
    <div class="social"><a href="https://x.com/areebithink" target="_blank"><i class="fab fa-twitter"></i></a></div>
  </nav>

  <div id="tickerWrap"><div id="ticker-tape" class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div></div>

  <section class="section">
    <h2>Full Trade History</h2>

    <div class="filters">
      <button class="btn" id="btn7">Last 7 Days</button>
      <button class="btn" id="btn40">Last 40 Days</button>

      <div class="date-group">
        <i class="fas fa-calendar-alt"></i>
        <label for="fromDate">From</label>
        <input type="date" id="fromDate">
        <label for="toDate">To</label>
        <input type="date" id="toDate">
        <button class="btn" id="applyRange">Apply</button>
        <button class="btn btn-outline" id="showAll">Show All</button>
      </div>
    </div>

    <div id="historyTable" class="trade-grid"></div>
  </section>

  <footer><p style="text-align:center;">Back to <a href="index.html">Home</a></p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="script.js"></script>
  <script>
    function readyRender() {
      const render = window.renderHistoryToContainer;
      const filterFn = window.filterTradesForHistory;
      render("historyTable", filterFn());
      document.getElementById("btn7").onclick = () => render("historyTable", filterFn(7));
      document.getElementById("btn40").onclick = () => render("historyTable", filterFn(40));
      document.getElementById("applyRange").onclick = () => {
        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;
        if (!from && !to) return alert("Please select From and/or To dates.");
        render("historyTable", filterFn(null, from, to));
      };
      document.getElementById("showAll").onclick = () => render("historyTable", filterFn());
    }
    const wait = setInterval(() => {
      if (window.__trading_portfolio && window.renderHistoryToContainer) { clearInterval(wait); readyRender(); }
    }, 150);
  </script>
</body>
</html>
